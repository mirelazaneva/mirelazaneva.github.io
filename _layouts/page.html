---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: " en " }}">
{% include header.html %}
<body data-theme="{{ site.mode }}" class="notransition">
<script>
const body = document.body;
const data = body.getAttribute("data-theme");

const initTheme = (state) => {
  if (state === "dark") {
    body.setAttribute("data-theme", "dark");
  } else if (state === "light") {
    body.removeAttribute("data-theme");
  } else {
    localStorage.setItem("theme", data);
  }
};

// Initialize theme from localStorage
initTheme(localStorage.getItem("theme"));

// Remove the no-transition class
setTimeout(() => body.classList.remove("notransition"), 75);

// Add click handler for the mode toggle button
window.addEventListener("load", () => {
  const modeToggle = document.getElementById("mode");
  if (modeToggle) {
    modeToggle.addEventListener("click", () => {
      const currentTheme = body.getAttribute("data-theme");
      if (currentTheme === "dark") {
        body.removeAttribute("data-theme");
        localStorage.setItem("theme", "light");
      } else {
        body.setAttribute("data-theme", "dark");
        localStorage.setItem("theme", "dark");
      }
    });
  }
});
</script>
  {% include navbar.html %}
<div class="wrapper">
<header class="header">
<h1 class="header-title center" itemprop="headline">{{ page.title | escape }}.</h1>
</header>
<main class="page-content" aria-label="Content">
      {% include anchor_headings.html html=content anchorClass="anchor-head" beforeHeading=true h_min=4 h_max=4 %}
</main>
</div>
</body>
</html>
